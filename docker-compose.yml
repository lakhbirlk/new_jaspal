name: business-directory

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-directory}
      MYSQL_USER: ${DB_USER:-directory}
      MYSQL_PASSWORD: ${DB_PASSWORD:-directory}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  app:
    build:
      context: .
    image: business-directory:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-directory}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ${DB_USER:-directory}
      DB_PASSWORD: ${DB_PASSWORD:-directory}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
      APP_CRYPTO_KEY: ${APP_CRYPTO_KEY:-ZGV2LW9ubHktY3J5cHRvLWtleS1jaGFuZ2UtbWUtMzJieXRlcw==}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@directory.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      ADMIN_NAME: ${ADMIN_NAME:-Platform Administrator}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      MAIL_FROM: ${MAIL_FROM:-no-reply@directory.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    restart: unless-stopped

volumes:
  mysqldata:
