server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: business-directory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/directory}
    username: ${DB_USER:directory}
    password: ${DB_PASSWORD:directory}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  task:
    scheduling:
      pool:
        size: 2

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
    access-token-minutes: 15
    refresh-token-days: 7
  crypto:
    key: ${APP_CRYPTO_KEY:ZGV2LW9ubHktY3J5cHRvLWtleS1jaGFuZ2UtbWUtMzJieXRlcw==}
  frontend-url: ${FRONTEND_URL:http://localhost:8081}
  admin:
    email: ${ADMIN_EMAIL:admin@directory.local}
    password: ${ADMIN_PASSWORD:Admin@12345}
    full-name: ${ADMIN_NAME:Platform Administrator}
  mail:
    from: ${MAIL_FROM:no-reply@directory.local}
  dev:
    expose-email-tokens: ${EXPOSE_EMAIL_TOKENS:false}
    seed-demo: ${SEED_DEMO:false}
  rate-limit:
    login-per-minute: 10
    register-per-minute: 5
    search-per-minute: 60
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:5173}
  payments:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
  listing:
    reminder-days: 7

logging:
  level:
    org.flywaydb: info
    com.example.directory: info
